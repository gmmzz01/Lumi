; =============================================================
;  Lumi - Firmware ESP32-S3 (asistente de voz en la nube)
; =============================================================
; Requiere Arduino core 3.x (ESP-IDF 5.x) para el driver I2S nuevo
; (driver/i2s_std.h). Usamos la plataforma pioarduino, que trae
; ese core. El canal "stable" se actualiza solo.
; =============================================================

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; PSRAM octal (modelos N8R8 / N16R8). Si tu placa NO tiene PSRAM,
; borra estas dos lineas.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    links2004/WebSockets@^2.6.1
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.17.0
